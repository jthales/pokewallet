<a class="skip-link" href="#main">Pular para o conteúdo</a>
<header class="topbar">
  <a routerLink="/" class="brand" aria-label="PokéWallet, início">
    <span class="logo" aria-hidden="true"></span>
    <span>Poké<b>Wallet</b></span>
  </a>
  <nav class="top-nav" aria-label="Navegação principal">
    @for (item of nav; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>{{ item.label }}
      </a>
    }
  </nav>
</header>

<main id="main" class="page">
  <router-outlet />
</main>

<nav class="bottom-nav" aria-label="Navegação principal">
  @for (item of nav; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      [class.scan]="item.path === '/scanner'"
    >
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
